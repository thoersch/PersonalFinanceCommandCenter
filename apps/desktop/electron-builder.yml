appId: com.financefinder.app
productName: Finance Finder
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
  # For distribution outside your own machine, add signing + notarization:
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # notarize: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
